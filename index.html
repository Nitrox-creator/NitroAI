<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NitroAI — Chat & base PIAF</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1d1d1d;
      --panel: #171717;
      --panel-2: #212121;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.18);
      --text: #f3f3f3;
      --muted: #a8a8a8;
      --green: #10a37f;
      --green-2: #0f8d6f;
      --user: #1f2d2a;
      --assistant: #272727;
      --danger: #ff5d5d;
      --warning: #ffbf69;
      --shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      padding: 9px 12px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.08);
    }

    button:active {
      transform: translateY(1px);
    }

    .layout {
      height: 100dvh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--green);
      color: #08251b;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 800;
    }

    .new {
      border: 1px solid var(--line-strong);
      text-align: left;
      background: rgba(255,255,255,0.02);
    }

    .section {
      font-size: 12px;
      color: var(--muted);
      padding: 2px 8px 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #chatList {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 80px;
      padding-right: 2px;
    }

    .chatrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
    }

    .chatrow:hover {
      background: rgba(255,255,255,0.04);
    }

    .chatrow.selected {
      background: rgba(16,163,127,0.14);
      border-color: rgba(16,163,127,0.4);
    }

    .chatmain {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .chatlabel {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .chatdelete {
      padding: 5px 7px;
      font-size: 13px;
      opacity: 0.8;
      border: 1px solid transparent;
    }

    .sidebottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    .dbbox {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 10px;
      color: var(--muted);
      line-height: 1.45;
    }

    .dbbox strong {
      color: var(--text);
      font-size: 14px;
    }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .top {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.01);
    }

    .top strong {
      font-size: 17px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 7px 10px;
    }

    .status {
      padding: 10px 20px 0;
      color: var(--muted);
      font-size: 13px;
      min-height: 24px;
    }

    #messages {
      flex: 1;
      overflow: auto;
      padding: 16px 18px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .empty {
      margin: auto;
      text-align: center;
      max-width: 620px;
      padding: 20px;
    }

    .empty h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    .muted {
      color: var(--muted);
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .suggestions button {
      text-align: left;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.02);
      padding: 12px 14px;
    }

    .message {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      margin-top: 2px;
    }

    .message.user .avatar {
      background: rgba(16,163,127,0.25);
      color: #dffdf5;
    }

    .bubble {
      max-width: min(720px, 100%);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: rgba(16,163,127,0.15);
      border-color: rgba(16,163,127,0.35);
    }

    .message.assistant .bubble {
      background: rgba(255,255,255,0.02);
    }

    .composerwrap {
      border-top: 1px solid var(--line);
      padding: 12px 18px 14px;
      background: rgba(255,255,255,0.01);
    }

    form.composer {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    textarea {
      width: 100%;
      min-height: 52px;
      max-height: 180px;
      resize: vertical;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    textarea:focus, input:focus, select:focus {
      border-color: rgba(16,163,127,0.7);
      box-shadow: 0 0 0 3px rgba(16,163,127,0.12);
      outline: none;
    }

    .send {
      min-width: 120px;
      background: var(--green);
      color: #031a15;
      font-weight: 700;
      border: none;
      height: 52px;
    }

    .send:hover {
      background: var(--green-2);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 20;
    }

    .modal.open {
      display: grid;
    }

    .dialog {
      width: min(540px, 100%);
      background: #252525;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .dialog h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .dialog label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog input,
    .dialog textarea {
      width: 100%;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .dialog textarea {
      min-height: 120px;
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .secondary {
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.02);
    }

    .danger {
      border-color: rgba(255,93,93,0.6);
      background: rgba(255,93,93,0.08);
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }
      aside {
        display: none;
      }
      .suggestions {
        grid-template-columns: 1fr;
      }
      .empty h1 {
        font-size: 25px;
      }
      form.composer {
        grid-template-columns: 1fr;
      }
      .send {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="logo">N</span>NitroAI</div>
      <button class="new" id="newChat">＋ Nouveau chat</button>

      <div class="section">Historique</div>
      <div id="chatList"></div>

      <div class="sidebottom">
        <button id="loadPiaf">⇩ Charger le dataset PIAF (JSON)</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
        <button id="reloadPiaf">↻ Recharger PIAF</button>
        <button id="addKnowledge">＋ Ajouter une connaissance</button>

        <div class="dbbox">
          <strong id="dbLabel">Base de connaissances : chargement...</strong><br>
          <span id="dbInfo">Chargement du corpus local et tentative auto de piaf-v1.2.json…</span>
        </div>
      </div>
    </aside>

    <main>
      <div class="top">
        <strong id="chatTitle">NitroAI</strong>
        <div class="topbar-actions">
          <select id="mode" aria-label="Mode de réponse">
            <option value="both">IA + base</option>
            <option value="knowledge">Base seule</option>
          </select>
        </div>
      </div>

      <div class="status" id="status">Chargement de la base de connaissances…</div>

      <div id="messages"></div>

      <div class="composerwrap">
        <form id="form" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message à NitroAI…" aria-label="Message"></textarea>
          <button class="send" type="submit" aria-label="Envoyer">Envoyer</button>
        </form>
      </div>
    </main>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Ajouter une connaissance</h3>
      <label for="knowTitle">Titre</label>
      <input id="knowTitle" placeholder="Titre de la connaissance">
      <label for="knowText">Texte</label>
      <textarea id="knowText" placeholder="Saisis le contenu à ajouter dans la base…"></textarea>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel">Annuler</button>
        <button type="button" class="send" id="save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const demo = [
      { title: 'Le ciel bleu', text: 'Le ciel paraît bleu parce que les molécules de l’atmosphère diffusent davantage les courtes longueurs d’onde de la lumière solaire, notamment le bleu.' },
      { title: 'Moteur à quatre temps', text: 'Un moteur à combustion interne transforme l’énergie de combustion en mouvement mécanique. Les quatre phases sont admission, compression, combustion-détente et échappement.' },
      { title: 'Système solaire', text: 'Le système solaire comprend le Soleil et les objets gravitant autour de lui, dont huit planètes, leurs satellites, des planètes naines, des astéroïdes et des comètes.' },
      { title: 'Python', text: 'Python est un langage de programmation interprété à syntaxe lisible. Il sert notamment à automatiser, créer des applications et analyser des données.' }
    ];

    const STORAGE = {
      corpus: 'nitroai_corpus_v2',
      chats: 'nitroai_chats_v2',
      current: 'nitroai_current_chat_v2'
    };

    let corpus = loadCorpus();
    let chats = loadChats();
    let current = localStorage.getItem(STORAGE.current) || null;

    function readJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : fallback;
      } catch (error) {
        console.warn('Lecture storage impossible:', key, error);
        return fallback;
      }
    }

    function loadCorpus() {
      const saved = readJSON(STORAGE.corpus, null);
      return saved && saved.length ? saved : demo.map(item => ({ ...item, id: cryptoRandomId() }));
    }

    function loadChats() {
      try {
        const raw = localStorage.getItem(STORAGE.chats);
        const parsed = raw ? JSON.parse(raw) : null;
        if (!Array.isArray(parsed) || !parsed.length) return [];
        return parsed;
      } catch {
        return [];
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE.corpus, JSON.stringify(corpus));
      localStorage.setItem(STORAGE.chats, JSON.stringify(chats));
      if (current) localStorage.setItem(STORAGE.current, current);
    }

    function cryptoRandomId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function createChat(title = 'Nouveau chat') {
      const chat = {
        id: cryptoRandomId(),
        title,
        messages: []
      };
      chats.unshift(chat);
      current = chat.id;
      saveState();
      render();
      return chat;
    }

    function activeChat() {
      if (!current) {
        current = chats[0]?.id || null;
      }
      return chats.find(chat => chat.id === current) || null;
    }

    function sortChats() {
      chats = chats.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function updateChatTimestamp(chat) {
      if (!chat) return;
      chat.updatedAt = Date.now();
    }

    function renderList() {
      const list = $('chatList');
      list.innerHTML = '';

      if (!chats.length) {
        list.innerHTML = '<div class="muted" style="padding:8px 10px;">Aucun chat</div>';
        return;
      }

      chats.forEach(chat => {
        const row = document.createElement('div');
        row.className = 'chatrow' + (chat.id === current ? ' selected' : '');

        const main = document.createElement('div');
        main.className = 'chatmain';
        main.title = chat.title;
        main.onclick = () => {
          current = chat.id;
          saveState();
          render();
        };

        const label = document.createElement('div');
        label.className = 'chatlabel';
        label.textContent = chat.title || 'Sans titre';
        main.appendChild(label);

        const del = document.createElement('button');
        del.className = 'chatdelete';
        del.type = 'button';
        del.textContent = '✕';
        del.title = 'Supprimer ce chat';
        del.onclick = (event) => {
          event.stopPropagation();
          chats = chats.filter(item => item.id !== chat.id);
          if (current === chat.id) {
            current = chats[0]?.id || null;
          }
          saveState();
          render();
        };

        row.appendChild(main);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function renderMessages() {
      const root = $('messages');
      const chat = activeChat();
      if (!chat || !chat.messages.length) {
        root.innerHTML = `
          <div class="empty">
            <h1>Que veux-tu explorer ?</h1>
            <div class="muted">Chat local avec historique et base de connaissances PIAF importable.</div>
            <div class="suggestions">
              <button type="button" data-prompt="Qu’est-ce que le système solaire ?">Qu’est-ce que le système solaire ?</button>
              <button type="button" data-prompt="Explique-moi le moteur à quatre temps.">Explique-moi le moteur à quatre temps.</button>
              <button type="button" data-prompt="Pourquoi le ciel est-il bleu ?">Pourquoi le ciel est-il bleu ?</button>
              <button type="button" data-prompt="Que peut-on faire avec Python ?">Que peut-on faire avec Python ?</button>
            </div>
          </div>
        `;

        root.querySelectorAll('[data-prompt]').forEach(button => {
          button.onclick = () => send(button.dataset.prompt);
        });
        return;
      }

      root.innerHTML = '';
      chat.messages.forEach(message => {
        const wrap = document.createElement('div');
        wrap.className = 'message ' + message.role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = message.role === 'user' ? 'T' : 'N';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = message.content;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        root.appendChild(wrap);
      });

      requestAnimationFrame(() => {
        const messages = $('messages');
        messages.scrollTop = messages.scrollHeight;
      });
    }

    function render() {
      const chat = activeChat();
      if (!current && chats.length) current = chats[0].id;
      if (!current && !chats.length) {
        createChat('Nouveau chat');
        return;
      }

      $('chatTitle').textContent = chat?.title || 'NitroAI';
      renderList();
      renderMessages();
      saveState();
    }

    function normalizeText(str) {
      return String(str || '').toLocaleLowerCase('fr').normalize('NFD').replace(/\p{Diacritic}/gu, '');
    }

    function tokenize(str) {
      return (normalizeText(str).match(/[a-z0-9]+/g) || []).filter(word => word.length > 2);
    }

    function flattenPIAF(data) {
      const out = [];
      const root = data && data.data ? data.data : data;

      const walk = (item) => {
        if (!item || typeof item !== 'object') return;

        if (Array.isArray(item)) {
          item.forEach(walk);
          return;
        }

        if (item.paragraphs && Array.isArray(item.paragraphs)) {
          item.paragraphs.forEach(walk);
          return;
        }

        if (item.qas && Array.isArray(item.qas)) {
          item.qas.forEach(qa => {
            const question = qa.question || qa.prompt || '';
            const answer = qa.answers && qa.answers[0] ? qa.answers[0].text || qa.answers[0].answer || '' : (qa.answer || '');
            const context = item.context || item.text || '';
            const title = question || (item.title || 'PIAF');
            if (question || answer || context) {
              out.push({
                title: title,
                question: question,
                answer: answer,
                text: context,
                context: context
              });
            }
          });
          return;
        }

        if (item.context || item.text || item.answer || item.question) {
          const text = item.text || item.context || item.answer || item.question || '';
          const answer = item.answer || item.text || '';
          const question = item.question || item.title || '';
          if (text || answer || question) {
            out.push({
              title: item.title || question || 'PIAF',
              question: question,
              answer: answer,
              text: text,
              context: item.context || item.text || ''
            });
          }
        }

        Object.values(item).forEach(walk);
      };

      walk(root);

      return out.filter(entry => (entry.text || entry.answer || entry.context || entry.question || entry.title)).slice(0, 20000);
    }

    function updateDbStatus(label, info, statusText) {
      $('dbLabel').textContent = label;
      $('dbInfo').textContent = info;
      if (statusText) $('status').textContent = statusText;
    }

    function applyCorpus(parsed) {
      if (!Array.isArray(parsed) || !parsed.length) {
        throw new Error('Format JSON PIAF non reconnu ou vide.');
      }
      corpus = parsed.map(item => ({ ...item, id: cryptoRandomId() }));
      saveState();
      updateDbStatus(
        'Base PIAF chargée',
        parsed.length.toLocaleString('fr-FR') + ' passages importés depuis piaf-v1.2.json.',
        'Base de connaissances prête !'
      );
    }

    async function loadPiafFromFile(file) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const results = flattenPIAF(parsed);
      applyCorpus(results);
    }

    async function autoLoadPiaf() {
      const candidates = [
        './piaf-v1.2.json',
        '/piaf-v1.2.json',
        '/Nitrox-creator/NitroAI/piaf-v1.2.json'
      ];

      for (const url of candidates) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) continue;
          const json = await response.json();
          const parsed = flattenPIAF(json);
          if (!parsed.length) continue;
          applyCorpus(parsed);
          return;
        } catch (error) {
          console.warn('Impossible de charger', url, error);
        }
      }

      updateDbStatus(
        'Erreur de chargement de PIAF',
        'Le fichier piaf-v1.2.json est introuvable. Tu peux l’importer manuellement avec le bouton “Charger le dataset”.',
        'Aucun dataset PIAF trouvé : l’application continue avec la base d’exemple.'
      );
      corpus = demo.map(item => ({ ...item, id: cryptoRandomId() }));
      saveState();
    }

    function retrieve(query) {
      const qset = new Set(tokenize(query));
      if (!qset.size) return [];

      return corpus
        .map(document => {
          const text = [document.title, document.text, document.question, document.answer, document.context].join(' ');
          const tokens = tokenize(text);
          const uniqueTokens = new Set(tokens);
          let score = 0;

          for (const word of qset) {
            if (uniqueTokens.has(word)) score += 2;
            if (tokens.filter(token => token === word).length > 1) score += 1;
          }

          return { document, score, tokens };
        })
        .filter(entry => entry.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);
    }

    function buildAnswer(query, docs, mode) {
      if (!docs.length) {
        if (mode === 'knowledge') {
          return 'Je ne trouve pas de résultat fiable dans la base PIAF pour cette question.';
        }
        return 'Je ne trouve pas d’extrait dans la base chargée qui répond à cette question. Essaie d’importer un dataset PIAF ou d’ajouter une connaissance.';
      }

      const topDocs = docs.slice(0, 3);
      const evidence = topDocs.map((entry, index) => {
        const document = entry.document;
        const text = document.answer || document.text || document.context || document.question || document.title || '';
        const snippet = text.replace(/\s+/g, ' ').trim();
        return `• ${document.title || 'Extrait ' + (index + 1)} : ${snippet.slice(0, 260)}`;
      }).join('\n\n');

      if (mode === 'knowledge') {
        return evidence;
      }

      const answer = `D’après la base locale, voici les éléments les plus pertinents :\n\n${evidence}`;
      return answer;
    }

    function send(rawPrompt) {
      const q = (rawPrompt || $('prompt').value).trim();
      if (!q) return;

      let chat = activeChat();
      if (!chat) chat = createChat('Nouveau chat');

      if (!chat.messages) chat.messages = [];
      chat.messages.push({ role: 'user', content: q });
      updateChatTimestamp(chat);

      const mode = $('mode').value;
      const docs = retrieve(q);
      const reply = buildAnswer(q, docs, mode);

      chat.messages.push({ role: 'assistant', content: reply });
      chat.title = chat.title && chat.title !== 'Nouveau chat' ? chat.title : (q.length > 42 ? q.slice(0, 42) + '…' : q);
      saveState();
      render();
      $('prompt').value = '';
      $('prompt').focus();
    }

    function openModal() {
      const modal = $('modal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      $('knowTitle').focus();
    }

    function closeModal() {
      const modal = $('modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      $('knowTitle').value = '';
      $('knowText').value = '';
    }

    function addKnowledge() {
      const title = $('knowTitle').value.trim();
      const text = $('knowText').value.trim();
      if (!title && !text) {
        alert('Saisis un titre et un texte pour ajouter une connaissance.');
        return;
      }

      const item = {
        title: title || 'Connaissance ajoutée',
        text: text || title,
        question: title,
        answer: text || title,
        context: text || title
      };

      corpus.unshift(item);
      saveState();
      closeModal();
      updateDbStatus(
        'Base de connaissances mise à jour',
        corpus.length.toLocaleString('fr-FR') + ' éléments disponibles dans la base locale.',
        'Connaissance ajoutée à la base.'
      );
    }

    function bindEvents() {
      $('newChat').onclick = () => createChat('Nouveau chat');

      $('loadPiaf').onclick = () => $('file').click();
      $('reloadPiaf').onclick = async () => {
        $('status').textContent = 'Rechargement du dataset PIAF…';
        await autoLoadPiaf();
      };

      $('file').onchange = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          $('status').textContent = 'Import du fichier JSON…';
          await loadPiafFromFile(file);
          $('status').textContent = 'Fichier PIAF importé avec succès.';
        } catch (error) {
          console.error(error);
          $('status').textContent = 'Le fichier sélectionné n’est pas un dataset PIAF valide.';
        } finally {
          event.target.value = '';
        }
      };

      $('addKnowledge').onclick = openModal;
      $('cancel').onclick = closeModal;
      $('save').onclick = addKnowledge;

      $('form').onsubmit = (event) => {
        event.preventDefault();
        send();
      };

      $('prompt').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          $('form').requestSubmit();
        }
      });

      $('modal').addEventListener('click', (event) => {
        if (event.target === $('modal')) closeModal();
      });
    }

    function init() {
      bindEvents();
      if (!chats.length) {
        chats = [{ id: cryptoRandomId(), title: 'Nouveau chat', messages: [] }];
        current = chats[0].id;
      }
      render();
      autoLoadPiaf();
    }

    init();
  </script>
</body>
</html>
